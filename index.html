<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeMama</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black">
<div class="max-w-5xl mx-auto p-4">
<h1 class="text-2xl font-black tracking-tight">codemama<span class="font-light">.visual</span></h1>

<div class="grid md:grid-cols-2 gap-6 mt-6">
<div>
<select id="lang" class="border border-black rounded-full px-4 py-2 text-sm w-full">
<option>Python</option><option>JavaScript</option><option>Java</option><option>C++</option><option>C</option>
</select>
<textarea id="code" class="w-full h-80 mt-3 border border-black rounded-xl p-4 font-mono text-sm">for i in range(5):
    x = i * 2
    print(x)</textarea>
<button onclick="run()" class="mt-3 w-full bg-black text-white rounded-full py-3 font-bold">VISUALIZE →</button>
</div>

<div>
<div class="border border-black rounded-xl p-4">
<div id="mem" class="flex gap-3"></div>
<div id="info" class="mt-4 font-mono text-xs text-gray-500"></div>
</div>
<div id="steps" class="mt-4 space-y-2"></div>
</div>
</div>
</div>

<script>
let cur=0, arr=[];
function run(){
let code=document.getElementById('code').value;
let n=(code.match(/range\((\d+)\)/)||code.match(/<\s*(\d+)/)||[0,5])[1];
n=parseInt(n);
arr=[];
for(let i=0;i<n;i++) arr.push({i,x:i*2});
cur=0; show();
}
function show(){
let s=arr[cur];
document.getElementById('mem').innerHTML=`<div class="border border-black rounded-lg px-6 py-3"><div class="text-xs">i</div><div class="text-2xl font-bold">${s.i}</div></div><div class="bg-black text-white rounded-lg px-6 py-3"><div class="text-xs opacity-60">x</div><div class="text-2xl font-bold">${s.x}</div></div><div class="border border-dashed rounded-lg px-6 py-3"><div class="text-xs">${cur+1}/${arr.length}</div></div>`;
document.getElementById('info').innerHTML=`Line: for loop • Iteration ${cur+1} of ${arr.length}`;
document.getElementById('steps').innerHTML=arr.map((a,i)=>`<div onclick="cur=${i};show()" class="cursor-pointer border ${i==cur?'border-black bg-black text-white':'border-gray-200'} rounded-full px-4 py-2 text-sm flex justify-between"><span>Step ${i+1}: i=${a.i} → x=${a.x}</span><span>${i==cur?'●':''}</span></div>`).join('');
}
</script>
</body>
</html>
