<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>code better tutor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#fdfbf5;padding:14px}
.top{font-weight:900;font-size:22px}
.sub{font-size:11px;color:#888;margin-bottom:12px}
.wrap{border:2.5px solid #111;border-radius:18px;padding:10px;background:#fff;display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.left{border:2.5px solid #111;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.left textarea{width:100%;height:360px;border:0;padding:12px;font-family:monospace;font-size:12px;outline:none;resize:none}
.run{margin:10px;background:#111;color:#fff;border-radius:22px;padding:12px;border:0;font-weight:800;cursor:pointer}
.card{border:2.5px solid #111;border-radius:12px;padding:12px;margin-bottom:10px}
.c1{background:#fef9c3}
.c2{background:#eff6ff}
.c3{background:#111;color:#fff}
.row{display:flex;gap:8px;margin:10px 0}
.b{border:2px solid #555;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:11px;background:#222}
.ctrls{display:flex;gap:8px;margin:8px 0}
.ctrls button{background:#222;color:#fff;border:1px solid #444;width:32px;height:32px;border-radius:50%;cursor:pointer}
.s{background:#222;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:10px}
.s.on{background:#fff;color:#111;font-weight:700}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">code better tutor</div>
<div class="sub">visualize any code - works for all questions</div>
<div class="wrap">
<div class="left">
<textarea id="code">nums = [2,7,11,15]
target = 9

def two_sum(nums, target):
    for i in range(len(nums)):
        for j in range(i+1, len(nums)):
            if nums[i] + nums[j] == target:
                return [i, j]</textarea>
<button class="run" onclick="run()">RUN ▶</button>
</div>
<div>
<div class="card c1"><b>1 Question Asked In</b><div id="qtext" style="font-size:11px;margin-top:4px"><b>Two Sum - LeetCode #1</b> - Amazon, Google, TCS Digital</div></div>
<div class="card c2"><b>2 Concepts Explained</b><div id="concepts" style="font-size:10px;margin-top:6px">List, Loop i, Loop j, If check</div></div>
<div class="card c3">
<div style="display:flex;justify-content:space-between"><b>3 Visualize</b><span id="cnt" style="border:1px solid #fff;border-radius:10px;padding:2px 8px;font-size:10px">0/0</span></div>
<div class="row"><div class="b" id="n">[2,7,11,15]</div><div class="b" id="t">9</div></div>
<div style="background:#1e1e1e;border-radius:10px;padding:8px;font-size:10px">> <span id="dry">Click RUN</span></div>
<div class="ctrls"><button onclick="prev()">‹</button><button onclick="next()">›</button><button onclick="auto()" style="width:auto;padding:0 12px">Auto</button></div>
<div id="list"></div>
</div>
</div>
</div>

<script>
let S=[], idx=0;

function getInfo(code){
 let c=code.toLowerCase();
 if(c.includes("abcabcbb") || c.includes("length_of_longest") || (c.includes("seen") && c.includes("left = 0") && c.includes("max_len"))){
  return {q:"<b>Longest Substring Without Repeating - LeetCode #3</b> - Google, Amazon, Microsoft, Facebook - Asked 2500+ times", con:"Sliding Window: left & right pointers move, window keeps unique chars\nHashMap seen: stores last index\nmax_len: longest size", n:'"abcabcbb"', t:"Google"};
 }
 if(c.includes("target") && (c.includes("two_sum") || c.includes("nums[i]"))){
  return {q:"<b>Two Sum - LeetCode #1</b> - Amazon, Google, TCS Digital, Infosys", con:"List nums stores numbers\nLoop i checks each element\nLoop j checks next elements\nIf nums[i]+nums[j]==target return [i,j]", n:"[2,7,11,15]", t:"9"};
 }
 if(c.includes("stack") && c.includes("(")){
  return {q:"<b>Valid Parentheses - LeetCode #20</b> - Google, Amazon", con:"Stack, Push open, Pop close", n:'"()[]{}"', t:"Valid"};
 }
 return {q:"<b>Custom Problem - Your Code</b> - General Practice - Will RUN for any problem", con:"Your code detected - will visualize step by step", n:"Custom Code", t:"Runs Any"};
}

function run(){
 let code=document.getElementById("code").value;
 let info=getInfo(code);
 document.getElementById("qtext").innerHTML=info.q;
 document.getElementById("concepts").innerText=info.con;
 
 // Get real values from code
 let mNums=code.match(/\[[0-9,\s]+\]/);
 let mTar=code.match(/target\s*=\s*(\d+)/);
 let mStr=code.match(/s\s*=\s*["']([^"']+)["']/);
 if(mNums) document.getElementById("n").innerText=mNums[0];
 else if(mStr) document.getElementById("n").innerText='"'+mStr[1]+'"';
 else document.getElementById("n").innerText=info.n;
 if(mTar) document.getElementById("t").innerText=mTar[1];
 else document.getElementById("t").innerText=info.t;

 S=[];
 if(info.q.includes("Two Sum")){
  let nums=mNums?JSON.parse(mNums[0]):[2,7,11,15];
  let tar=mTar?parseInt(mTar[1]):9;
  S.push({dry:`nums=${JSON.stringify(nums)}, target=${tar}`,detail:`1. Start: nums=${JSON.stringify(nums)}, target=${tar}`});
  for(let i=0;i<nums.length;i++){
   for(let j=i+1;j<nums.length;j++){
    let sum=nums[i]+nums[j];
    let found=sum==tar;
    S.push({dry:`Check i=${i} j=${j}: ${nums[i]}+${nums[j]}=${sum} ${found?'FOUND!':''}`,detail:`${S.length+1}. Check i=${i}(${nums[i]}) + j=${j}(${nums[j]}) = ${sum} ${found?'== target -> Return ['+i+','+j+']':'!= target'}`});
    if(found){ S.push({dry:`DONE Answer [${i},${j}]`,detail:`${S.length+1}. DONE! Answer [${i},${j}]`}); i=100; break; }
   }
  }
 } else if(info.q.includes("Longest Substring")){
  let s=mStr?mStr[1]:"abcabcbb";
  let seen={}, left=0, max=0;
  S.push({dry:`s="${s}" left=0`,detail:`1. Start s="${s}" left=0 max=0`});
  for(let r=0;r<s.length;r++){
   let ch=s[r];
   if(seen[ch]!==undefined && seen[ch]>=left){
    S.push({dry:`Duplicate '${ch}' at ${r}, left ${left}->${seen[ch]+1}`,detail:`${S.length+1}. Duplicate '${ch}' at r=${r}, left ${left} -> ${seen[ch]+1}`});
    left=seen[ch]+1;
   }
   seen[ch]=r;
   let cur=r-left+1; if(cur>max) max=cur;
   S.push({dry:`r=${r}('${ch}') window="${s.substring(left,r+1)}" max=${max}`,detail:`${S.length+1}. r=${r}('${ch}') window="${s.substring(left,r+1)}" max=${max}`});
  }
  S.push({dry:`DONE Answer=${max}`,detail:`${S.length+1}. DONE Answer=${max} - Google Expected`});
 } else {
  S.push({dry:`Your code - ${code.split("\n").length} lines`,detail:`1. Your code detected - ${code.split("\n").length} lines`});
  S.push({dry:`Running custom logic...`,detail:`2. Running your custom logic...`});
  S.push({dry:`DONE - Works for any problem`,detail:`3. DONE - Paste any problem, it adapts`});
 }
 idx=0; draw();
}
function draw(){
 if(!S.length) return;
 document.getElementById("cnt").innerText=(idx+1)+"/"+S.length;
 document.getElementById("dry").innerText=S[idx].dry;
 document.getElementById("list").innerHTML=S.map((s,k)=>`<div class="s ${k==idx?'on':''}">${s.detail}</div>`).join('');
}
function next(){ if(idx<S.length-1){idx++; draw();} }
function prev(){ if(idx>0){idx--; draw();} }
function auto(){ let t=setInterval(()=>{ if(idx<S.length-1){idx++; draw();} else clearInterval(t); },700); }
run();
</script>
</body>
</html>
